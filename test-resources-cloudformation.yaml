      BaseName: !Sub '${EnvironmentName}-processing-secure'
      JobConfig:
        RoleArn: !GetAtt SageMakerExecutionRole.Arn
        AppSpecification:
          ImageUri: !Sub '683313688378.dkr.ecr.${AWS::Region}.amazonaws.com/sagemaker-scikit-learn:0.23-1-cpu-py3'
        ProcessingInputs:
          - InputName: code
            S3Input:
              S3Uri: !Sub 's3://${SageMakerBucket}/processing-code/'
              LocalPath: /opt/ml/processing/input/code
              S3DataType: S3Prefix
              S3InputMode: File
        ProcessingOutputConfig:
          Outputs:
            - OutputName: output
              S3Output:
                S3Uri: !Sub 's3://${SageMakerBucket}/processing-output/'
                LocalPath: /opt/ml/processing/output
                S3UploadMode: EndOfJob
          KmsKeyId: !GetAtt SageMakerKMSKey.Arn  # PASS SM-17
        ProcessingResources:
          ClusterConfig:
            InstanceType: ml.m5.large
            InstanceCount: 1
            VolumeSizeInGB: 10
            VolumeKmsKeyId: !GetAtt SageMakerKMSKey.Arn
        NetworkConfig:
          EnableNetworkIsolation: true
          VpcConfig:
            SecurityGroupIds:
              - !Ref DefaultSecurityGroup
            Subnets:
              - !Ref PrivateSubnet1
        StoppingCondition:
          MaxRuntimeInSeconds: 3600
        Tags:
          - Key: Name
            Value: !Sub '${EnvironmentName}-processing-secure'
          - Key: Purpose
            Value: SecurityTestingPass

  # SM-18: Transform Job (batch inference with encryption)
  SageMakerTransformJobSecure:
    Type: Custom::SageMakerJob
    DependsOn: SageMakerBucketSeedData
    Properties:
      ServiceToken: !GetAtt SageMakerJobCustomResourceFunction.Arn
      JobType: Transform
      BaseName: !Sub '${EnvironmentName}-transform-secure'
      JobConfig:
        ModelName: !GetAtt SageMakerModelWithIsolation.ModelName
        TransformInput:
          DataSource:
            S3DataSource:
              S3DataType: S3Prefix
              S3Uri: !Sub 's3://${SageMakerBucket}/transform-input/'
          ContentType: text/csv
        TransformOutput:
          S3OutputPath: !Sub 's3://${SageMakerBucket}/transform-output/'
          KmsKeyId: !GetAtt SageMakerKMSKey.Arn  # PASS SM-18
        TransformResources:
          InstanceType: ml.m5.xlarge
          InstanceCount: 1
          VolumeKmsKeyId: !GetAtt SageMakerKMSKey.Arn
        Tags:
          - Key: Name
            Value: !Sub '${EnvironmentName}-transform-secure'
          - Key: Purpose
            Value: SecurityTestingPass

  # ============================================================================
  # ECR REPOSITORIES - For AC-05 testing
  # ============================================================================

  AgentCoreECRRepository:
    Type: AWS::ECR::Repository
    Condition: CreateAgentCoreResources
    Properties:
      RepositoryName: !Sub '${EnvironmentName}-agentcore-runtime'
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt AgentCoreKMSKey.Arn
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-agentcore-repo'
        - Key: Purpose
          Value: SecurityTestingPass

  AgentCoreECRRepositoryNoEncryption:
    Type: AWS::ECR::Repository
    Condition: CreateAgentCoreResources
    Properties:
      RepositoryName: !Sub '${EnvironmentName}-agentcore-no-encryption'
      EncryptionConfiguration:
        EncryptionType: AES256  # FAIL AC-05 - uses AWS-managed key
      ImageScanningConfiguration:
        ScanOnPush: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-agentcore-repo-fail'
        - Key: Purpose
          Value: SecurityTestingFail

  # ============================================================================
  # CLOUDTRAIL - For BR-06 testing
  # ============================================================================

  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-cloudtrail-bucket'

  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 's3:GetBucketAcl'
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${CloudTrailBucket.Arn}/*'
            Condition:
              StringEquals:
                's3:x-amz-acl': 'bucket-owner-full-control'

  CloudTrailBucketCleanup:
    Type: Custom::SageMakerResource
    Properties:
      ServiceToken: !GetAtt SageMakerJobCustomResourceFunction.Arn
      ResourceKind: BucketCleanup
      BucketName: !Ref CloudTrailBucket

  # BR-06: CloudTrail with Bedrock logging (PASS)
  CloudTrailWithBedrock:
    Type: AWS::CloudTrail::Trail
    DependsOn:
      - CloudTrailBucketPolicy
      - CloudTrailBucketCleanup
    Properties:
      TrailName: !Sub '${EnvironmentName}-trail'
      S3BucketName: !Ref CloudTrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EventSelectors:
        - ReadWriteType: All
          IncludeManagementEvents: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-cloudtrail'

  # ============================================================================
  # OUTPUTS
  # ============================================================================

Outputs:
  VPCId:
    Description: VPC ID for test resources
    Value: !Ref VPC
    Export:
      Name: !Sub '${EnvironmentName}-vpc-id'

  PrivateSubnet1Id:
    Description: Private Subnet 1 ID
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub '${EnvironmentName}-private-subnet-1'

  PrivateSubnet2Id:
    Description: Private Subnet 2 ID
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub '${EnvironmentName}-private-subnet-2'

  BedrockKMSKeyArn:
    Description: Bedrock KMS Key ARN
    Value: !GetAtt BedrockKMSKey.Arn
    Export:
      Name: !Sub '${EnvironmentName}-bedrock-kms-arn'

  SageMakerKMSKeyArn:
    Description: SageMaker KMS Key ARN
    Value: !GetAtt SageMakerKMSKey.Arn
    Export:
      Name: !Sub '${EnvironmentName}-sagemaker-kms-arn'

  SageMakerBucketName:
    Description: SageMaker S3 Bucket Name
    Value: !Ref SageMakerBucket
    Export:
      Name: !Sub '${EnvironmentName}-sagemaker-bucket'

  BedrockLoggingBucketName:
    Description: Bedrock Logging S3 Bucket Name
    Value: !Ref BedrockLoggingBucket
    Export:
      Name: !Sub '${EnvironmentName}-bedrock-logs-bucket'

  SageMakerNotebookFailName:
    Description: SageMaker Notebook (Should Fail Checks)
    Value: !GetAtt SageMakerNotebookWithInternet.NotebookInstanceName

  SageMakerNotebookPassName:
    Description: SageMaker Notebook (Should Pass Checks)
    Value: !GetAtt SageMakerNotebookSecure.NotebookInstanceName

  EndpointFailName:
    Description: SageMaker Endpoint Single Instance (Should Fail SM-12)
    Value: !GetAtt SageMakerEndpointSingleInstance.EndpointName

  EndpointPassName:
    Description: SageMaker Endpoint Multi Instance (Should Pass SM-12)
    Value: !GetAtt SageMakerEndpointMultiInstance.EndpointName

  DomainFailName:
    Description: SageMaker Domain with Public Internet (Should Fail SM-01, SM-08)
    Value: !GetAtt SageMakerDomainFail.DomainId

  DomainPassName:
    Description: SageMaker Domain VPC Only (Should Pass SM-01)
    Value: !GetAtt SageMakerDomainPass.DomainId

  TrainingJobPassName:
    Description: Training Job with Encryption (Should Pass SM-03)
    Value: !Ref SageMakerTrainingJobWithEncryption

  ProcessingJobName:
    Description: Processing Job with Encryption (Should Pass SM-17)
    Value: !GetAtt SageMakerProcessingJobSecure.ProcessingJobName

  TransformJobName:
    Description: Transform Job with Encryption (Should Pass SM-18)
    Value: !Ref SageMakerTransformJobSecure

  AgentCoreECRRepoPass:
    Condition: CreateAgentCoreResources
    Description: AgentCore ECR Repository with CMK (Should Pass AC-05)
    Value: !GetAtt AgentCoreECRRepository.RepositoryUri

  AgentCoreECRRepoFail:
    Condition: CreateAgentCoreResources
    Description: AgentCore ECR Repository without CMK (Should Fail AC-05)
    Value: !GetAtt AgentCoreECRRepositoryNoEncryption.RepositoryUri

  TestingInstructions:
    Description: Instructions for running security assessments
    Value: |
      1. Deploy this template in us-east-1
      2. Wait for all resources to be created (10-15 minutes)
      3. Run your security assessment against this account
      4. Expected results:
         - FAIL: Notebooks with direct internet, roles with full access, single-instance endpoints
         - PASS: Secure notebooks in VPC, least-privilege roles, multi-instance endpoints
      5. Note: Some Bedrock features require manual configuration (guardrails, prompts)
      6. Clean up: Delete this stack when testing is complete
