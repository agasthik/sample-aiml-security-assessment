AWSTemplateFormatVersion: '2010-09-09'
Description: 'Comprehensive AIML Security Assessment Test Resources - Creates resources that both pass and fail security checks for Bedrock, SageMaker, and AgentCore'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Network Configuration"
        Parameters:
          - AvailabilityZone1
          - AvailabilityZone2
      - Label:
          default: "Resource Configuration"
        Parameters:
          - EnvironmentName
          - EnableAgentCore
    ParameterLabels:
      EnvironmentName:
        default: "Environment Name"
      AvailabilityZone1:
        default: "First Availability Zone"
      AvailabilityZone2:
        default: "Second Availability Zone"

Parameters:
  EnvironmentName:
    Type: String
    Default: aiml-sec-test
    Description: Prefix for all resource names
    AllowedPattern: ^[a-z0-9-]+$
    ConstraintDescription: Must contain only lowercase letters, numbers, and hyphens

  AvailabilityZone1:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: First Availability Zone for subnet placement

  AvailabilityZone2:
    Type: AWS::EC2::AvailabilityZone::Name
    Description: Second Availability Zone for subnet placement

  EnableAgentCore:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable AgentCore resources (requires preview access)

Conditions:
  CreateAgentCoreResources: !Equals [!Ref EnableAgentCore, 'true']

Resources:
  # ============================================================================
  # KMS KEYS - One per service for encryption tests
  # ============================================================================

  BedrockKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer-managed key for Bedrock resources
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow Bedrock to use the key
            Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
              - 'kms:CreateGrant'
            Resource: '*'
            Condition:
              StringEquals:
                'kms:ViaService': !Sub 'bedrock.${AWS::Region}.amazonaws.com'
          - Sid: Allow CloudWatch Logs to use the Bedrock key
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              ArnEquals:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock/${EnvironmentName}'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-bedrock-key'
        - Key: Purpose
          Value: SecurityTesting

  BedrockKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${EnvironmentName}-bedrock'
      TargetKeyId: !Ref BedrockKMSKey

  SageMakerKMSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Customer-managed key for SageMaker resources
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow SageMaker to use the key
            Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
            Resource: '*'
          - Sid: Allow CloudWatch Logs to use the SageMaker key
            Effect: Allow
            Principal:
              Service: !Sub 'logs.${AWS::Region}.amazonaws.com'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
            Condition:
              ArnEquals:
                'kms:EncryptionContext:aws:logs:arn': !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/sagemaker/${EnvironmentName}'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sagemaker-key'
        - Key: Purpose
          Value: SecurityTesting

  SageMakerKMSKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${EnvironmentName}-sagemaker'
      TargetKeyId: !Ref SageMakerKMSKey

  AgentCoreKMSKey:
    Type: AWS::KMS::Key
    Condition: CreateAgentCoreResources
    Properties:
      Description: Customer-managed key for AgentCore resources
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: Allow AgentCore to use the key
            Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action:
              - 'kms:Decrypt'
              - 'kms:GenerateDataKey'
              - 'kms:CreateGrant'
              - 'kms:DescribeKey'
            Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-agentcore-key'
        - Key: Purpose
          Value: SecurityTesting

  AgentCoreKMSKeyAlias:
    Type: AWS::KMS::Alias
    Condition: CreateAgentCoreResources
    Properties:
      AliasName: !Sub 'alias/${EnvironmentName}-agentcore'
      TargetKeyId: !Ref AgentCoreKMSKey

  # ============================================================================
  # VPC AND NETWORKING - Comprehensive setup for all checks
  # ============================================================================

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Public Subnets for NAT Gateway and resources that need internet
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Ref AvailabilityZone1
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-1'
        - Key: Type
          Value: Public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Ref AvailabilityZone2
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-subnet-2'
        - Key: Type
          Value: Public

  # Private Subnets for secure resource deployment
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Ref AvailabilityZone1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-subnet-1'
        - Key: Type
          Value: Private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.12.0/24
      AvailabilityZone: !Ref AvailabilityZone2
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-subnet-2'
        - Key: Type
          Value: Private

  # NAT Gateway for private subnet internet access
  NATGatewayEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-eip'

  NATGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NATGatewayEIP.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-nat-gateway'

  # Route Tables
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-public-rt'

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-rt'

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NATGateway

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # Security Groups
  DefaultSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub '${EnvironmentName}-default-sg'
      GroupDescription: Default security group for test resources
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 10.0.0.0/16
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-default-sg'

  # VPC Endpoints for Bedrock (BR-02 check - some present, some missing)
  BedrockVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.bedrock-runtime'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref DefaultSecurityGroup

  # Intentionally NOT creating bedrock-agent and bedrock-agent-runtime endpoints for BR-02 to fail

  # VPC Endpoints for SageMaker
  SageMakerAPIVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sagemaker.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref DefaultSecurityGroup

  SageMakerRuntimeVPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.sagemaker.runtime'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref DefaultSecurityGroup

  # S3 Gateway Endpoint (required for SageMaker and Bedrock)
  S3VPCEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable
        - !Ref PublicRouteTable

  # ============================================================================
  # IAM ROLES - Intentionally permissive for security check failures
  # ============================================================================

  # BR-01: Role with AmazonBedrockFullAccess (FAIL)
  BedrockFullAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonBedrockFullAccess'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-bedrock-full-access'
        - Key: Purpose
          Value: SecurityTestingFail

  # BR-03: Role with overly permissive marketplace subscription access (FAIL)
  MarketplaceOverlyPermissiveRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: OverlyPermissiveMarketplace
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: 'aws-marketplace:Subscribe'
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-marketplace-overpermissive'
        - Key: Purpose
          Value: SecurityTestingFail

  # SM-02: Role with AmazonSageMakerFullAccess (FAIL)
  SageMakerFullAccessRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSageMakerFullAccess'
      Policies:
        - PolicyName: SageMakerTestBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                  - 's3:ListBucket'
                  - 's3:GetBucketAcl'
                Resource:
                  - !Sub 'arn:aws:s3:::${SageMakerBucket}/*'
                  - !Sub 'arn:aws:s3:::${SageMakerBucket}'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sagemaker-full-access'
        - Key: Purpose
          Value: SecurityTestingFail

  # Least-privilege SageMaker role for resources that should PASS
  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - sagemaker.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/AmazonSageMakerCanvasFullAccess'
        - 'arn:aws:iam::aws:policy/AmazonSageMakerFeatureStoreAccess'
      Policies:
        - PolicyName: SageMakerS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:GetObject'
                  - 's3:PutObject'
                  - 's3:DeleteObject'
                  - 's3:ListBucket'
                  - 's3:GetBucketAcl'
                Resource:
                  - !Sub 'arn:aws:s3:::${SageMakerBucket}/*'
                  - !Sub 'arn:aws:s3:::${SageMakerBucket}'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:GenerateDataKey'
                Resource: !GetAtt SageMakerKMSKey.Arn
              - Effect: Allow
                Action:
                  - 'ec2:CreateNetworkInterface'
                  - 'ec2:CreateNetworkInterfacePermission'
                  - 'ec2:DeleteNetworkInterface'
                  - 'ec2:DescribeNetworkInterfaces'
                  - 'ec2:DescribeSecurityGroups'
                  - 'ec2:DescribeSubnets'
                  - 'ec2:DescribeVpcs'
                Resource: '*'
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-sagemaker-exec'
        - Key: Purpose
          Value: SecurityTestingPass

  # CloudFormation does not support TrainingJob/TransformJob resource types directly.
  # Create those fixture jobs through a Lambda-backed custom resource instead.
  SageMakerJobCustomResourceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: SageMakerJobCustomResourceAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 'sagemaker:CreateTrainingJob'
                  - 'sagemaker:DescribeTrainingJob'
                  - 'sagemaker:StopTrainingJob'
                  - 'sagemaker:CreateTransformJob'
                  - 'sagemaker:DescribeTransformJob'
                  - 'sagemaker:StopTransformJob'
                  - 'sagemaker:CreateProcessingJob'
                  - 'sagemaker:DescribeProcessingJob'
                  - 'sagemaker:StopProcessingJob'
                  - 'sagemaker:CreateEndpoint'
                  - 'sagemaker:DescribeEndpoint'
                  - 'sagemaker:DeleteEndpoint'
                  - 'sagemaker:CreateDomain'
                  - 'sagemaker:DescribeDomain'
                  - 'sagemaker:DeleteDomain'
                  - 'sagemaker:ListDomains'
                  - 'sagemaker:AddTags'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 'iam:PassRole'
                Resource:
                  - !GetAtt SageMakerFullAccessRole.Arn
                  - !GetAtt SageMakerExecutionRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': 'sagemaker.amazonaws.com'
              - Effect: Allow
                Action:
                  - 'kms:CreateGrant'
                  - 'kms:Decrypt'
                  - 'kms:DescribeKey'
                  - 'kms:Encrypt'
                  - 'kms:GenerateDataKey'
                Resource: !GetAtt SageMakerKMSKey.Arn
              - Effect: Allow
                Action:
                  - 's3:ListBucket'
                  - 's3:ListBucketVersions'
                Resource: '*'
              - Effect: Allow
                Action:
                  - 's3:DeleteObject'
                  - 's3:DeleteObjectVersion'
                  - 's3:PutObject'
                Resource: '*'

  SageMakerJobCustomResourceFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt SageMakerJobCustomResourceRole.Arn
      Timeout: 60
      Code:
        ZipFile: |
          import hashlib
          import json
          import logging
          import urllib.request

          import boto3
          from botocore.exceptions import ClientError

          LOGGER = logging.getLogger()
          LOGGER.setLevel(logging.INFO)
          SM = boto3.client("sagemaker")
          S3 = boto3.client("s3")


          def send(event, context, status, data=None, physical_resource_id=None, reason=None):
              body = json.dumps(
                  {
                      "Status": status,
                      "Reason": reason or f"See CloudWatch Logs: {context.log_stream_name}",
                      "PhysicalResourceId": physical_resource_id or context.log_stream_name,
                      "StackId": event["StackId"],
                      "RequestId": event["RequestId"],
                      "LogicalResourceId": event["LogicalResourceId"],
                      "NoEcho": False,
                      "Data": data or {},
                  }
              ).encode("utf-8")
              request = urllib.request.Request(
                  event["ResponseURL"],
                  data=body,
                  method="PUT",
                  headers={"content-type": "", "content-length": str(len(body))},
              )
              with urllib.request.urlopen(request) as response:
                  LOGGER.info("CloudFormation response status: %s", response.status)


          def props_for_hash(resource_properties):
              return {
                  key: value
                  for key, value in resource_properties.items()
                  if key != "ServiceToken"
              }


          def sanitize_name(name):
              sanitized = "".join(
                  character if character.isalnum() or character == "-" else "-"
                  for character in name
              ).strip("-")
              return sanitized or "job"


          def build_resource_name(base_name, stack_id, resource_properties, max_length=63):
              stack_suffix = stack_id.rsplit("/", 1)[-1][:8]
              props_hash = hashlib.sha1(
                  json.dumps(
                      props_for_hash(resource_properties),
                      sort_keys=True,
                      separators=(",", ":"),
                  ).encode("utf-8")
              ).hexdigest()[:8]
              max_base_length = max_length - len(stack_suffix) - len(props_hash) - 2
              base = sanitize_name(base_name)[:max_base_length].rstrip("-")
              if not base:
                  base = "job"
              return f"{base}-{stack_suffix}-{props_hash}"


          def is_missing(error):
              code = error.response.get("Error", {}).get("Code", "")
              message = error.response.get("Error", {}).get("Message", "")
              return code in {"ValidationException", "ResourceNotFound", "404"} or "Could not find" in message


          def normalize_types(value):
              if isinstance(value, dict):
                  return {key: normalize_types(item) for key, item in value.items()}
              if isinstance(value, list):
                  return [normalize_types(item) for item in value]
              if isinstance(value, str):
                  lowered = value.lower()
                  if lowered == "true":
                      return True
                  if lowered == "false":
                      return False
                  if value.isdigit() or (value.startswith("-") and value[1:].isdigit()):
                      return int(value)
              return value


          def describe_job(resource_kind, resource_name):
              if resource_kind == "TrainingJob":
                  return SM.describe_training_job(TrainingJobName=resource_name)
              if resource_kind == "TransformJob":
                  return SM.describe_transform_job(TransformJobName=resource_name)
              if resource_kind == "ProcessingJob":
                  return SM.describe_processing_job(ProcessingJobName=resource_name)
              if resource_kind == "Endpoint":
                  return SM.describe_endpoint(EndpointName=resource_name)
              if resource_kind == "Domain":
                  return SM.describe_domain(DomainId=resource_name)
              raise ValueError(f"Unsupported resource kind {resource_kind}")


          def create_job(resource_kind, resource_name, job_config):
              payload = normalize_types(dict(job_config))
              if resource_kind == "TrainingJob":
                  payload["TrainingJobName"] = resource_name
                  SM.create_training_job(**payload)
                  return
              if resource_kind == "TransformJob":
                  payload["TransformJobName"] = resource_name
                  SM.create_transform_job(**payload)
                  return
              if resource_kind == "ProcessingJob":
                  payload["ProcessingJobName"] = resource_name
                  SM.create_processing_job(**payload)
                  return
              raise ValueError(f"Unsupported job kind {resource_kind}")


          def ensure_job(resource_kind, resource_name, job_config):
              try:
                  describe_job(resource_kind, resource_name)
                  LOGGER.info("%s %s already exists", resource_kind, resource_name)
                  return resource_name
              except ClientError as error:
                  if not is_missing(error):
                      raise
              create_job(resource_kind, resource_name, job_config)
              LOGGER.info("Created %s %s", resource_kind, resource_name)
              return resource_name


          def stop_job(resource_kind, resource_name):
              try:
                  if resource_kind == "TrainingJob":
                      SM.stop_training_job(TrainingJobName=resource_name)
                  elif resource_kind == "TransformJob":
                      SM.stop_transform_job(TransformJobName=resource_name)
                  elif resource_kind == "ProcessingJob":
                      SM.stop_processing_job(ProcessingJobName=resource_name)
                  else:
                      raise ValueError(f"Unsupported job kind {resource_kind}")
                  LOGGER.info("Stopped %s %s", resource_kind, resource_name)
              except ClientError as error:
                  if not is_missing(error):
                      raise


          def ensure_endpoint(endpoint_name, endpoint_config_name, tags=None):
              try:
                  describe_job("Endpoint", endpoint_name)
                  LOGGER.info("Endpoint %s already exists", endpoint_name)
                  return endpoint_name
              except ClientError as error:
                  if not is_missing(error):
                      raise
              payload = {
                  "EndpointName": endpoint_name,
                  "EndpointConfigName": endpoint_config_name,
              }
              if tags:
                  payload["Tags"] = tags
              SM.create_endpoint(**payload)
              LOGGER.info("Created endpoint %s", endpoint_name)
              return endpoint_name


          def delete_endpoint(endpoint_name):
              try:
                  SM.delete_endpoint(EndpointName=endpoint_name)
                  LOGGER.info("Deleted endpoint %s", endpoint_name)
              except ClientError as error:
                  if not is_missing(error):
                      raise


          def find_domain_id_by_name(domain_name):
              next_token = None
              while True:
                  request = {"MaxResults": 100}
                  if next_token:
                      request["NextToken"] = next_token
                  response = SM.list_domains(**request)
                  for domain in response.get("Domains", []):
                      if domain.get("DomainName") == domain_name:
                          return domain.get("DomainId")
                  next_token = response.get("NextToken")
                  if not next_token:
                      return None


          def ensure_domain(domain_name, domain_config):
              domain_id = find_domain_id_by_name(domain_name)
              if domain_id:
                  LOGGER.info("Domain %s already exists as %s", domain_name, domain_id)
                  return domain_id

              payload = normalize_types(dict(domain_config))
              payload["DomainName"] = domain_name
              response = SM.create_domain(**payload)
              domain_arn = response.get("DomainArn", "")
              domain_id = domain_arn.rsplit("/", 1)[-1] if domain_arn else ""
              if not domain_id:
                  domain_id = find_domain_id_by_name(domain_name) or domain_name
              LOGGER.info("Created domain %s as %s", domain_name, domain_id)
              return domain_id


          def delete_domain(domain_id):
              try:
                  SM.delete_domain(
                      DomainId=domain_id,
                      RetentionPolicy={"HomeEfsFileSystem": "Delete"},
                  )
                  LOGGER.info("Deleted domain %s", domain_id)
              except ClientError as error:
                  if not is_missing(error):
                      raise


          def batched(items, size):
              for index in range(0, len(items), size):
                  yield items[index:index + size]


          def delete_objects(bucket_name, objects):
              for batch in batched(objects, 1000):
                  S3.delete_objects(
                      Bucket=bucket_name,
                      Delete={"Objects": batch, "Quiet": True},
                  )


          def empty_bucket(bucket_name):
              try:
                  paginator = S3.get_paginator("list_object_versions")
                  for page in paginator.paginate(Bucket=bucket_name):
                      objects = [
                          {"Key": version["Key"], "VersionId": version["VersionId"]}
                          for version in page.get("Versions", [])
                      ] + [
                          {"Key": marker["Key"], "VersionId": marker["VersionId"]}
                          for marker in page.get("DeleteMarkers", [])
                      ]
                      if objects:
                          delete_objects(bucket_name, objects)
              except ClientError as error:
                  if not is_missing(error):
                      raise
                  return

              paginator = S3.get_paginator("list_objects_v2")
              for page in paginator.paginate(Bucket=bucket_name):
                  objects = [{"Key": item["Key"]} for item in page.get("Contents", [])]
                  if objects:
                      delete_objects(bucket_name, objects)


          def seed_bucket(bucket_name, objects):
              for item in objects:
                  S3.put_object(
                      Bucket=bucket_name,
                      Key=item["Key"],
                      Body=item.get("Body", ""),
                  )


          def handler(event, context):
              LOGGER.info("Received event: %s", json.dumps(event))
              properties = event["ResourceProperties"]
              physical_resource_id = event.get("PhysicalResourceId")
              resource_kind = properties.get("ResourceKind")
              if not resource_kind:
                  resource_kind = f'{properties["JobType"]}Job'

              try:
                  if event["RequestType"] == "Delete":
                      if physical_resource_id:
                          if resource_kind in {"TrainingJob", "TransformJob", "ProcessingJob"}:
                              stop_job(resource_kind, physical_resource_id)
                          elif resource_kind == "Endpoint":
                              delete_endpoint(physical_resource_id)
                          elif resource_kind == "Domain":
                              delete_domain(physical_resource_id)
                          elif resource_kind == "BucketCleanup":
                              empty_bucket(physical_resource_id)
                          elif resource_kind == "SeedBucket":
                              LOGGER.info("Seed bucket delete is a no-op for %s", physical_resource_id)
                      send(
                          event,
                          context,
                          "SUCCESS",
                          {"PhysicalId": physical_resource_id or ""},
                          physical_resource_id=physical_resource_id or context.log_stream_name,
                      )
                      return

                  if resource_kind in {"TrainingJob", "TransformJob", "ProcessingJob"}:
                      resource_name = build_resource_name(
                          properties["BaseName"],
                          event["StackId"],
                          properties,
                      )
                      ensure_job(resource_kind, resource_name, properties["JobConfig"])
                      data = {
                          "JobName": resource_name,
                          "ProcessingJobName": resource_name if resource_kind == "ProcessingJob" else "",
                      }
                  elif resource_kind == "Endpoint":
                      resource_name = build_resource_name(
                          properties["BaseName"],
                          event["StackId"],
                          properties,
                      )
                      ensure_endpoint(
                          resource_name,
                          properties["EndpointConfigName"],
                          properties.get("Tags"),
                      )
                      data = {"EndpointName": resource_name}
                  elif resource_kind == "Domain":
                      domain_name = build_resource_name(
                          properties["BaseName"],
                          event["StackId"],
                          properties,
                      )
                      resource_name = ensure_domain(domain_name, properties["DomainConfig"])
                      data = {"DomainId": resource_name, "DomainName": domain_name}
                  elif resource_kind == "BucketCleanup":
                      resource_name = properties["BucketName"]
                      data = {"BucketName": resource_name}
                  elif resource_kind == "SeedBucket":
                      resource_name = properties["BucketName"]
                      seed_bucket(resource_name, properties["Objects"])
                      data = {"BucketName": resource_name}
                  else:
                      raise ValueError(f"Unsupported resource kind {resource_kind}")

                  if (
                      event["RequestType"] == "Update"
                      and physical_resource_id
                      and physical_resource_id != resource_name
                  ):
                      if resource_kind in {"TrainingJob", "TransformJob", "ProcessingJob"}:
                          stop_job(resource_kind, physical_resource_id)
                      elif resource_kind == "Endpoint":
                          delete_endpoint(physical_resource_id)
                      elif resource_kind == "Domain":
                          delete_domain(physical_resource_id)

                  send(
                      event,
                      context,
                      "SUCCESS",
                      data,
                      physical_resource_id=resource_name,
                  )
              except Exception as error:
                  LOGGER.exception("Custom resource failure")
                  send(
                      event,
                      context,
                      "FAILED",
                      {"Error": str(error)},
                      physical_resource_id=physical_resource_id,
                      reason=str(error),
                  )

